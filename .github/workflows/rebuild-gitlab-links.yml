name: Rebuild GitLab Release Links

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Rebuild asset links
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "87288318"
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "ERROR: GITLAB_TOKEN is empty!"
            exit 1
          fi
          echo "Token is set (length: ${#GITLAB_TOKEN})"
          python -u scripts/gitlab_publish_release.py --rebuild-links --tag latest 2>&1
